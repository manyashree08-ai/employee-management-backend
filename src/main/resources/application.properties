spring.application.name=employee-management-system
server.port=${SERVER_PORT:8080}

# ---- Database (MySQL) ----
# Override any of these with environment variables; defaults suit a local MySQL install.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employee_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA ----
# "update" creates/updates the schema automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Demo data ----
app.seed.enabled=${APP_SEED_ENABLED:true}

# ---- CORS (comma-separated list) ----
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# ---- JWT Security ----
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXRlc3RpbmctMTIzNDU2}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ---- Initial Administrator ----
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
