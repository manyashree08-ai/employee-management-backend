# Run the whole stack (MySQL + backend + frontend) with:
#   docker compose up --build
#
# Frontend:  http://localhost:3000
# Backend:   http://localhost:8080  (Swagger UI: /swagger-ui.html)
#
# NOTE: this file lives in the Backend folder and expects the Frontend folder
# to be its sibling (../Frontend), exactly as in the assignment layout.

services:
  mysql:
    image: mysql:8.0
    container_name: ems-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db
    ports:
      - "3307:3306"   # host port 3307 avoids clashing with a local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: ems-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: employee_db
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_SEED_ENABLED: "true"
      APP_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost"
      JWT_SECRET: "c3VwZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXRlc3RpbmctMTIzNDU2"
      JWT_EXPIRATION_MINUTES: 480
      APP_ADMIN_USERNAME: "admin"
      APP_ADMIN_PASSWORD: "admin123"
    ports:
      - "8080:8080"

  frontend:
    build: ../Frontend
    container_name: ems-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
